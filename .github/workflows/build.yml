name: 📦 Build NavSafe APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  build:
    name: 🔨 Compilation APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4
      - name: ☕ Configuration JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: 📱 Configuration Android SDK
        uses: android-actions/setup-android@v3
      - name: 🔑 Permissions Gradle
        run: chmod +x ./gradlew
      - name: 🏗️ Compilation
        run: ./gradlew assembleDebug --no-daemon
      - name: ✅ Vérification APK
        id: check-apk
        run: |
          APK_PATH=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK_PATH" && echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT || exit 1
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NavSafe-APK
          path: ${{ steps.check-apk.outputs.apk_path }}
          retention-days: 30
