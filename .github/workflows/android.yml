name: Android CI - Pigtune
on:
  push:
    branches: ["main","master"]
  pull_request:
    branches: ["main","master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Fix gradle-wrapper.jar - regenere si corrompu
        run: |
          mkdir -p gradle/wrapper
          echo "Verification du jar..."
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || ! unzip -t gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "JAR manquant ou corrompu (no manifest) -> regeneration"
            rm -f gradle/wrapper/gradle-wrapper.jar
            gradle wrapper --gradle-version 8.6 --distribution-type bin
            ls -lh gradle/wrapper/
            unzip -l gradle/wrapper/gradle-wrapper.jar | head -20
          else
            echo "JAR OK"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK sur GitHub
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pigtune-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
